services:
  - type: web
    name: muebleria-hermanos-jota-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://hermanos-jota-store.netlify.app
      - key: MONGODB_URI
        sync: false

